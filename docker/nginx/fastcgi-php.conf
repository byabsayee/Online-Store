# Shared with every pretty-URL route below that hands off to a specific .php script via
# `rewrite ... break;`. Using `break` (not `last`) keeps nginx from re-running location
# matching on the rewritten URI, so this is included directly rather than relying on the
# generic `location ~ \.php$` block further down — that avoids ever needing a redirect rule
# to "match itself" and risk a loop.
fastcgi_pass unix:/run/php/php8.3-fpm.sock;
fastcgi_index index.php;
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
fastcgi_param DOCUMENT_ROOT $document_root;
