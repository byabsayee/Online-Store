server {
    listen 80;
    server_name _;
    root /var/www/html;

    # nginx only knows it listens on 80 INSIDE the container. With absolute redirects on, a request for
    # /admin (a directory) was answered with `Location: http://host/admin/` — the published port (e.g. :1026)
    # got dropped. Relative redirects let the browser keep whatever host:port it used.
    absolute_redirect off;
    index index.php;

    # Kept in step with post_max_size in docker/php/uploads.ini — the branding form can post
    # up to four images (logo, dark logo, favicon, banner) in one request.
    client_max_body_size 70m;

    # Send nginx's own logs to stdout/stderr so they show up in
    # `docker logs <web container>` instead of only existing inside the
    # container's filesystem at /var/log/nginx/*.log.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Friendly 404 page (route missing files to a custom error page)
    error_page 404 /404.php;

    # Baseline security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Never serve or run the internal includes. The ^~ matters: without it the
    # \.php$ rule below wins and these files would be executed directly.
    location ^~ /includes/ {
        deny all;
    }
    location ^~ /admin/includes/ {
        deny all;
    }
    # Composer libraries (PHPMailer, Dompdf) sit inside the web root; their .php files must never be reachable by URL.
    location ^~ /vendor/ {
        deny all;
    }

    # Compress text-based responses (Debian's default only compresses HTML) —
    # noticeably faster on phones over mobile data.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css text/plain text/xml application/javascript text/javascript application/json
               application/manifest+json application/xml image/svg+xml;

    # robots.txt / sitemap.xml / manifest are generated by PHP so they always
    # match the store's current name, address and products.
    location = /ads.txt { rewrite ^ /ads_txt.php last; }
    location = /robots.txt { rewrite ^ /robots.php last; }
    location = /sitemap.xml { rewrite ^ /sitemap.php last; }
    location = /manifest.webmanifest { rewrite ^ /manifest.php last; }

    # ERP integration (protocol v1). API routes are signed machine-to-machine calls; the verify
    # route must be matched here, before the dotfile deny rule at the bottom would refuse .well-known.
    location = /.well-known/erp-verify {
        rewrite ^ /api/erp/verify.php break;
        include /etc/nginx/fastcgi-php.conf;
    }
    location ^~ /api/erp/v1/ {
        rewrite ^/api/erp/v1/(.*)$ /api/erp/index.php?route=$1&$args break;
        include /etc/nginx/fastcgi-php.conf;
        fastcgi_param REQUEST_URI $request_uri;
    }
    # The worker is a command-line script; never serve it over HTTP.
    location = /erp_worker.php { return 404; }

    # ---------------------------------------------------------------------
    # Pretty URLs (storefront only — /admin/ keeps its .php paths, since
    # those are never linked to customers or search engines).
    #
    # Each route below rewrites internally to the real .php script with
    # `break`, then includes fastcgi-php.conf directly rather than falling
    # through to the generic `location ~ \.php$` block further down. `break`
    # does NOT re-run location matching the way `last` does, so this can
    # never loop back into the redirect rules in the next section — that's
    # deliberate: it's what makes the plain-old-.php redirects below safe to
    # add without extra bookkeeping.
    # ---------------------------------------------------------------------
    location = /product/ { return 301 /; }
    location ~ ^/product/([^/]+)/?$ {
        # The capture group must be repeated in THIS rewrite's own pattern. `$1` only ever
        # reflects the most recently evaluated regex, and a bare `^` has no capturing groups
        # of its own — nginx does not carry `$1` over from the `location ~` match into a
        # later `rewrite`, so a bare `^` here silently rewrites to `slug=` (empty) on every
        # request. This was the actual cause of pretty-URL category/product/order pages
        # (and the site's own nav links to them) all coming up "not found" after the pretty-URL
        # rollout — verified by reproducing it in isolation before fixing it here.
        rewrite ^/product/([^/]+)/?$ /product.php?slug=$1&$args break;
        include /etc/nginx/fastcgi-php.conf;
    }
    location = /category/ { return 301 /; }
    location ~ ^/category/([^/]+)/?$ {
        rewrite ^/category/([^/]+)/?$ /category.php?slug=$1&$args break;
        include /etc/nginx/fastcgi-php.conf;
    }
    location ~ ^/order/([A-Za-z0-9\-]+)/?$ {
        rewrite ^/order/([A-Za-z0-9\-]+)/?$ /order-detail.php?order=$1&$args break;
        include /etc/nginx/fastcgi-php.conf;
    }
    location ~ ^/invoice/([A-Za-z0-9\-]+)/?$ {
        rewrite ^/invoice/([A-Za-z0-9\-]+)/?$ /invoice.php?order=$1&$args break;
        include /etc/nginx/fastcgi-php.conf;
    }
    location ~ ^/(cart|checkout|login|register|logout|account|addresses|orders|wishlist|search|contact|about|faq|partners|terms|privacy-policy|cookie-policy|refund-policy|shipping-policy|verify-email|resend-verification|order-success|google-login|google-callback|forgot-password|reset-password|unsubscribe)/?$ {
        rewrite ^/(.*?)/?$ /$1.php break;
        include /etc/nginx/fastcgi-php.conf;
    }

    # Old-style ?.php links (bookmarks, old search-engine index, anything still out there) land on
    # the pretty equivalent instead of a broken/ugly URL. Exact-match `location =` blocks only ever
    # fire on the client's own request URI — never on the internal `break` rewrites above — so this
    # can't loop with the routes above.
    # $request_uri is the client's original request line and is untouched by nginx's own internal
    # index-directive resolution (root "/" quietly resolves to index.php under the hood) — so this
    # only fires for someone/something that actually typed /index.php, never for a plain "/" visit.
    location = /index.php {
        if ($request_uri = /index.php) { return 301 /; }
        include /etc/nginx/fastcgi-php.conf;
    }
    location = /product.php {
        if ($arg_slug) { return 301 /product/$arg_slug; }
        return 301 /;
    }
    location = /category.php {
        if ($arg_slug) { return 301 /category/$arg_slug; }
        return 301 /;
    }
    location = /order-detail.php {
        if ($arg_order) { return 301 /order/$arg_order; }
        return 301 /orders;
    }
    location = /invoice.php {
        if ($arg_order) { return 301 /invoice/$arg_order; }
        return 301 /orders;
    }
    location ~ ^/(cart|checkout|login|register|logout|account|addresses|orders|wishlist|search|contact|about|faq|partners|terms|privacy-policy|cookie-policy|refund-policy|shipping-policy|verify-email|resend-verification|order-success|google-login|google-callback|forgot-password|reset-password|unsubscribe)\.php$ {
        return 301 /$1$is_args$args;
    }

    # CSS/JS are linked with ?v=<file time>, so a long cache is safe: a deploy changes the URL.
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # Uploaded photos / logos: static files, PHP execution disabled. Names are random and never
    # reused, so they cache for a long time. An uploaded SVG is only ever meant to be shown in an
    # <img>; the CSP below stops it running anything if someone opens the file directly.
    # Uploaded fonts: served as plain static files (the sandbox policy below would block them).
    location ^~ /uploads/fonts/ {
        location ~ \.php$ { deny all; }
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /uploads/ {
        location ~ \.php$ {
            deny all;
        }
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    # Deny dotfiles (.env, .git, etc.) if ever present under the docroot
    location ~ /\. {
        deny all;
    }
}
