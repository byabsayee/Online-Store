; Show PHP's error_log() output (mail failures, checkout errors, Google sign-in problems…) in
; `docker logs <web container>`. Without catch_workers_output, php-fpm throws worker stderr away and every
; "[mail] Failed to send …" line the app writes vanishes, which makes problems impossible to diagnose.
[www]
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
