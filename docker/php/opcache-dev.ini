; Dev-friendly OPcache: still caches compiled bytecode (fast), but checks each
; file's mtime on every request and recompiles it the instant it changes.
; This is what makes "just refresh the browser" work after editing PHP files
; with the ./src bind mount in docker-compose.yml — no rebuild/restart needed.
;
; Before a real production deploy (no bind mount, code baked into the image),
; you may want opcache.validate_timestamps=0 for a small perf gain, since the
; code can't change under a running container anyway.
opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
