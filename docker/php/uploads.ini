upload_max_filesize = 16M
; The branding form (Admin → Branding & sharing) posts up to four image fields
; (logo, dark logo, favicon, banner) in one request, so this has to comfortably
; clear 4 × upload_max_filesize, not just one file — otherwise PHP silently
; drops the whole $_POST/$_FILES payload (no error at all) whenever more than
; one large image is submitted at once, which is worse than a clear rejection.
post_max_size = 70M
memory_limit = 256M
max_execution_time = 60
