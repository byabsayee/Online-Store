# Local development only — Compose merges this file automatically.
# It mounts your working copy over the code in the image so edits show up on refresh.
# On a production server, delete this file (or run `docker compose -f docker-compose.yml up -d`).
# Run ./vendor-install.sh once first to create ./vendor (PHPMailer, Dompdf).

services:
  web:
    # Local development builds the image from this folder instead of pulling it from GHCR.
    image: online-store:local
    pull_policy: never
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./src:/var/www/html
      - ./uploads:/var/www/html/uploads
      - ./vendor:/var/www/html/vendor
