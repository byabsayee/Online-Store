# Online Store — stack definition (web + database + phpMyAdmin).
#
# One command:   docker compose up -d --build   — every variable has a default, so no .env is required.
# Open http://<server>:${WEB_PORT:-8080}/admin and sign in with admin / admin (you must pick a new password).
# The database tables are created automatically on first start. Set DB_PASS / DB_ROOT_PASS before going public.
#
# `web` is built from this folder. To use a prebuilt image instead (for example one published by your own
# CI), set STORE_IMAGE in .env and run `docker compose pull && docker compose up -d`.
# Running several stores on one server? Give each its own folder, WEB_PORT and COMPOSE_PROJECT_NAME.

services:
  web:
    image: ${STORE_IMAGE:-online-store:local}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-store_db}
      DB_USER: ${DB_USER:-admin}
      DB_PASS: ${DB_PASS:-admin}
      SITE_URL: ${SITE_URL:-}
      # First-run admin sign-in (you are made to choose a new password straight away). Only read on first boot.
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-admin}
      TZ: ${TZ:-Asia/Dhaka}
      APP_DEBUG: ${APP_DEBUG:-0}
      # Optional first-boot defaults — everything below can be changed later in the admin panel.
      SITE_NAME: ${SITE_NAME:-Online Store}
      CURRENCY_SYMBOL: ${CURRENCY_SYMBOL:-৳}
      CURRENCY_CODE: ${CURRENCY_CODE:-BDT}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Encrypts the accounting-link secrets at rest. Set once, before pairing, and never change it afterwards.
      ERP_SECRET_KEY: ${ERP_SECRET_KEY:-}
    volumes:
      # Uploaded photos, logos and fonts live in a real folder next to this file.
      - ./uploads:/var/www/html/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-store_db}
      MARIADB_USER: ${DB_USER:-admin}
      MARIADB_PASSWORD: ${DB_PASS:-admin}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-admin}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # phpMyAdmin: optional database UI. Delete this block (or firewall the port) if you don't need it.
  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER:-admin}
      PMA_PASSWORD: ${DB_PASS:-admin}
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
