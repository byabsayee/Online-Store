name: Build and publish Docker image

# Builds docker/php/Dockerfile and pushes it to GitHub Container Registry
# (ghcr.io/<owner>/online-store) so anyone — including Portainer's web editor —
# can deploy this project with a plain `image:` reference and zero build
# step of their own.
#
# Tags produced:
#   - `latest`        on every push to main
#   - `v1.2.3`/`1.2`/`1` on pushed tags matching v*.*.* (semver)
#   - `<git-sha>`      on every build, for pinning/rollback

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Skip login on pull_request builds from forks (no secrets available,
        # and we don't push on PRs anyway — see `push:` below).
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short

      - name: Build (and push on non-PR events)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
