name: PHP lint

# Syntax-checks every PHP file on pushes and PRs against main. Catches
# broken code before it's merged (and long before it hits a running
# container) — fast, no dependencies beyond PHP itself.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Lint all PHP files
        run: find src -name "*.php" -print0 | xargs -0 -n1 -P4 php -l
